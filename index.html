<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP em Lote - ViaCEP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        .info {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 10px 15px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: block;
            margin-bottom: 20px;
            width: 100%;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        button.btn-processar:hover:not(:disabled) { background-color: #2ecc71; }
        
        /* Estilos do botão de modelo */
        button.btn-modelo {
            background-color: #3498db;
            font-size: 14px;
            padding: 10px 15px;
        }
        button.btn-modelo:hover { background-color: #2980b9; }

        #status {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
        .progress-bar {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 20px;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Busca de CEP em Lote</h2>
    <div class="info">
        O seu CSV deve conter um cabeçalho na primeira linha com as colunas exatas (independentemente da ordem):<br>
        <strong>uf;cidade;logradouro;numero</strong>
    </div>

    <button id="btnBaixarModelo" class="btn-modelo">⬇️ Baixar CSV Modelo</button>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <input type="file" id="csvFileInput" accept=".csv">
    <button id="btnProcessar" class="btn-processar">▶️ Processar CSV</button>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div id="status"></div>
</div>

<script>
    const fileInput = document.getElementById('csvFileInput');
    const btnProcessar = document.getElementById('btnProcessar');
    const btnBaixarModelo = document.getElementById('btnBaixarModelo');
    const statusDiv = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    // Função para adicionar delay e não ser bloqueado pelo ViaCEP
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // Ação do botão de baixar modelo
    btnBaixarModelo.addEventListener('click', () => {
        const conteudoModelo = "uf;cidade;logradouro;numero\nSP;São Paulo;Avenida Paulista;1000\nRJ;Rio de Janeiro;Avenida Rio Branco;156\nMG;Belo Horizonte;Avenida Afonso Pena;500";
        baixarCSV(conteudoModelo, 'modelo_busca_cep.csv');
    });

    // Ação do botão de processar CSV
    btnProcessar.addEventListener('click', () => {
        const file = fileInput.files[0];
        if (!file) {
            alert("Por favor, selecione um arquivo CSV.");
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
            btnProcessar.disabled = true;
            btnBaixarModelo.disabled = true;
            fileInput.disabled = true;
            progressBar.style.display = 'block';
            
            const text = e.target.result;
            await processarCSV(text);
            
            btnProcessar.disabled = false;
            btnBaixarModelo.disabled = false;
            fileInput.disabled = false;
        };
        reader.readAsText(file);
    });

    async function processarCSV(csvText) {
        const linhas = csvText.split('\n').map(l => l.trim()).filter(l => l);
        if (linhas.length < 2) {
            statusDiv.innerText = "Erro: O CSV está vazio ou contém apenas o cabeçalho.";
            return;
        }

        const separador = linhas[0].includes(';') ? ';' : ',';
        const headers = linhas[0].toLowerCase().split(separador);
        
        const idxUF = headers.indexOf('uf');
        const idxCidade = headers.indexOf('cidade');
        const idxLogradouro = headers.indexOf('logradouro');
        const idxNumero = headers.indexOf('numero');

        if (idxUF === -1 || idxCidade === -1 || idxLogradouro === -1) {
            statusDiv.innerText = "Erro: Colunas 'uf', 'cidade' ou 'logradouro' não encontradas no cabeçalho.";
            return;
        }

        let resultadosCSV = "uf;cidade;logradouro;numero;cep_resultado\n";
        const totalLinhas = linhas.length - 1; // Tirando o cabeçalho

        for (let i = 1; i <= totalLinhas; i++) {
            const colunas = linhas[i].split(separador);
            const uf = colunas[idxUF]?.trim();
            const cidade = colunas[idxCidade]?.trim();
            const logradouro = colunas[idxLogradouro]?.trim();
            const numero = idxNumero !== -1 ? colunas[idxNumero]?.trim() : '';

            statusDiv.innerText = `Processando ${i} de ${totalLinhas}: ${logradouro}...`;
            progressFill.style.width = `${(i / totalLinhas) * 100}%`;

            let cepEncontrado = "Nao encontrado / Erro";

            if (uf && uf.length === 2 && cidade && logradouro && logradouro.length >= 3) {
                try {
                    const url = `https://viacep.com.br/ws/${uf}/${encodeURIComponent(cidade)}/${encodeURIComponent(logradouro)}/json/`;
                    const response = await fetch(url);
                    
                    if (response.ok) {
                        const dados = await response.json();
                        if (dados.length > 0) {
                            cepEncontrado = dados[0].cep; 
                        } else {
                            cepEncontrado = "Logradouro não localizado";
                        }
                    }
                } catch (error) {
                    cepEncontrado = "Falha na API";
                }
            } else {
                cepEncontrado = "Dados inválidos para busca";
            }

            resultadosCSV += `"${uf}";"${cidade}";"${logradouro}";"${numero}";"${cepEncontrado}"\n`;

            // Pausa de 1 segundo (1000ms)
            await delay(1000); 
        }

        statusDiv.innerText = "Concluído! O download começará em instantes.";
        baixarCSV(resultadosCSV, 'resultado_ceps.csv');
        progressFill.style.width = `100%`;
    }

    function baixarCSV(conteudo, nomeArquivo) {
        const blob = new Blob(["\uFEFF" + conteudo], { type: 'text/csv;charset=utf-8;' }); 
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", nomeArquivo);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
